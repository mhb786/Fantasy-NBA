{% extends 'mysite/base.html' %}

{% block title %} Player Comparison {% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            padding-top: 80px;
            padding-left: 30px;
        }

        #radarChartContainer {
            margin-top: 20px;
            max-width: 600px;  /* Adjusted width for better visibility */
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>
<body>
    <h2>Player Comparison Radar Chart</h2>
    
    <div id="radarChartContainer">
        <canvas id="radarChart" width="400" height="400"></canvas>
    </div>

    <script>
        var data = {
            labels: [{% for stat_label in selected_stats %}'{{ stat_label }}',{% endfor %}],
            datasets: [
                {
                    label: '{{ player1_stats.player_name }}',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    data: [
                        {% for stat_label, stat_value in player1_stats.items %}
                            {% if not forloop.first %},{% endif %}
                            {% if not stat_label == 'player_name' %}
                                {{ stat_value }}
                            {% endif %}
                        {% endfor %}
                    ],
                },
                {
                    label: '{{ player2_stats.player_name }}',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 2,
                    data: [
                        {% for stat_label, stat_value in player2_stats.items %}
                            {% if not forloop.first %},{% endif %}
                            {% if not stat_label == 'player_name' %}
                                {{ stat_value }}
                            {% endif %}
                        {% endfor %}
                    ],
                },
            ]
        };
    
        var options = {
            scale: {
                ticks: {
                    beginAtZero: true,
                    max: 30,
                }
            }
        };
    
        var ctx = document.getElementById('radarChart').getContext('2d');
        var radarChart = new Chart(ctx, {
            type: 'radar',
            data: data,
            options: options
        });
    </script>
    
    
</body>
</html>

{% endblock %}
