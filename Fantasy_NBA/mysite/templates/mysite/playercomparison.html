{% extends 'mysite/base.html' %}

{% block title %} Player Comparison {% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            padding-top: 80px;
            padding-left: 30px;
        }

        #radarChartContainer {
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>
<body>
    <h2>Player Comparison Radar Chart</h2>
    <canvas id="radarChart" width="400" height="400"></canvas>

    <script>
        var data = {
            labels: ['PPG', 'APG', 'RPG', 'SPG', 'BPG'],
            datasets: [
                {
                    label: '{{ player1_stats.player_name }}',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    data: [
                        {{ player1_stats.PPG }},
                        {{ player1_stats.APG }},
                        {{ player1_stats.RPG }},
                        {{ player1_stats.SPG }},
                        {{ player1_stats.BPG }},
                    ],
                },
                {
                    label: '{{ player2_stats.player_name }}',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 2,
                    data: [
                        {{ player2_stats.PPG }},
                        {{ player2_stats.APG }},
                        {{ player2_stats.RPG }},
                        {{ player2_stats.SPG }},
                        {{ player2_stats.BPG }},
                    ],
                },
            ]
        };

        var options = {
            scale: {
                ticks: {
                    beginAtZero: true,
                    max: 30,
                }
            }
        };

        var ctx = document.getElementById('radarChart').getContext('2d');
        var radarChart = new Chart(ctx, {
            type: 'radar',
            data: data,
            options: options
        });
    </script>
</body>
</html>


{% endblock %}
