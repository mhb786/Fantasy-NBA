{% extends 'mysite/base.html' %}

{% block title %} Create Thread {% endblock %}

{% block content %}
  <div style="padding-top: 40px;">
    <h1>Create New Thread</h1>

    <form method="post" action="{% url 'create_thread' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit</button>
    </form>
  </div>
{% endblock %}
