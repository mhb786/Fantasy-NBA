{% extends 'mysite/base.html' %}

{% block title %}Login Here{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
  <div class="container mt-5 pt-4"> <!-- Added top margin and padding-top -->
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-success text-white">
            <h4 class="mb-0">Login</h4>
          </div>
          <div class="card-body">
            <form method="post" class="form-group">
              {% csrf_token %}
              {{ form|crispy }}
              <button type="submit" class="btn btn-success btn-block mt-3">Login</button>
            </form>
            <hr class="my-4">
            <p class="text-center">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
